services:
  web:
    build:
      context: ./app
      dockerfile: Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/nodegoat
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?Set SEED_ADMIN_PASSWORD in .env}
      SEED_USER1_PASSWORD: ${SEED_USER1_PASSWORD:?Set SEED_USER1_PASSWORD in .env}
      SEED_USER2_PASSWORD: ${SEED_USER2_PASSWORD:?Set SEED_USER2_PASSWORD in .env}
    command: sh -c "until nc -z -w 2 mongo 27017; do sleep 2; done; node artifacts/db-reset.js && npm start"
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      - mongo
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  mongo:
    image: mongo:4.4
    user: mongodb
    expose:
      - "27017"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
