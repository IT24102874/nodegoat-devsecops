name: DevSecOps Security Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm install --legacy-peer-deps

      - name: Regression/security tests
        working-directory: app
        run: npm run security:test

      - uses: semgrep/semgrep@v1
        with:
           config: auto
      - name: Run Semgrep
        run: |
          pip install semgrep
          semgrep --config=auto --sarif --output=semgrep.sarif . || true     
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif    

      - name: Dependency scan - npm audit
        working-directory: app
        run: npm audit --audit-level=critical

      - name: Secrets scan - Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build container
        run: docker build -t nodegoat-devsecops:${{ github.sha }} ./app

      - name: Container scan - Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: nodegoat-devsecops:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Upload source bundle for traceability
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devsecops-source-${{ github.sha }}
          path: |
            app
            security
            docker-compose.yml
            README.md
